ServerRoot "/tmp"
ServerName localhost


# Load only the modules we need
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule security2_module /usr/lib/apache2/modules/mod_security2.so
LoadModule unique_id_module /usr/lib/apache2/modules/mod_unique_id.so

# Logging and runtime files
PidFile /tmp/hackathon-apache.pid
ErrorLog /dev/stderr
LogLevel warn

# ModSecurity needs a writable data directory
SecDataDir /tmp

Listen 8002
<VirtualHost *:8002>
    ServerName localhost

    # Proxy requests to the app
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:10000/
    ProxyPassReverse / http://127.0.0.1:10000/

    ErrorLog /tmp/hackathon_error.log
    CustomLog /tmp/hackathon_access.log combined
</VirtualHost>

Listen 8003
<VirtualHost *:8003>
    ServerName localhost

    # Enable modsec and check the user parameter for path traversal
    SecRuleEngine On
    SecRule ARGS:user "@contains ../" \
        "id:10010,phase:2,deny,status:403,log,t:none,msg:'Path traversal detected'"

    # This is included in modsec by default on most distributions and contains the CRS ruleset,
    # which includes mitigations for path traversal out of the box
    #IncludeOptional /usr/share/modsecurity-crs/*.load

    # Proxy requests to the app
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:10000/
    ProxyPassReverse / http://127.0.0.1:10000/

    ErrorLog /tmp/hackathon_modsec_error.log
    CustomLog /tmp/hackathon_modsec_access.log combined
</VirtualHost>
