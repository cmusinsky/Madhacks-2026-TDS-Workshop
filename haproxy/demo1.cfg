frontend http
    bind :8081
    mode http
    timeout client 10s

    stick-table type ip size 10k expire 30s store http_req_rate(10s)
    http-request track-sc0 src

    acl too_fast sc_http_req_rate(0) gt 10
    use_backend penalty_box if too_fast

    default_backend normal_app

backend normal_app
    mode http
    timeout connect 5s
    timeout server 10s
    server app 127.0.0.1:10000

backend penalty_box
    mode http
    timeout connect 5s
    timeout server 10s
    server penalty 127.0.0.1:10001
