frontend http
    bind :8081
    mode http
    timeout client 10s

    default_backend normal_app

backend normal_app
    mode http
    timeout connect 5s
    timeout server 10s

    # Demo 3: HTTP response manipulation

    # Identify the proxy to clients
    http-response set-header X-Proxy-Demo "HAProxy Party Tricks"

    # Hide the backend's Server header
    http-response del-header Server

    # Prevent the site from being embedded in an iframe
    http-response set-header X-Frame-Options DENY

    # Prevent inline JavaScript from executing
    http-response set-header Content-Security-Policy "script-src 'self'"

    server app 127.0.0.1:10000
