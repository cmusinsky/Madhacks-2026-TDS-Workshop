frontend http
    bind :8081
    mode http
    timeout client 10s

    default_backend normal_app

backend normal_app
    mode http
    timeout connect 5s
    timeout server 10s

    # Replace any supplied X-Forwarded-For
    # with the actual client connection IP
    http-request set-header X-Forwarded-For %[src]

    # Remove potentially identifying information
    http-request del-header Referer
    http-request del-header X-Requested-With

    # Remove client cookies before forwarding
    # Note: this will probably break sites relying on cookies for sessions
    http-request del-header Cookie

    http-request set-header User-Agent "Anonymous Hackathon Attendee"
    http-request del-header Accept
    http-request del-header Accept-Language
    http-request del-header Accept-Encoding
    http-request del-header Upgrade-Insecure-Requests
    http-request del-header Sec-Fetch-Dest
    http-request del-header Sec-Fetch-Mode
    http-request del-header Sec-Fetch-Site
    http-request del-header Sec-Fetch-User
    http-request del-header Priority

    # Kill some Javascript - uncomment to kill
    http-response set-header Content-Security-Policy "script-src 'self'"

    server app 127.0.0.1:10000
